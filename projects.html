<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Aayush Bhattarai</title>
  <link rel="icon" href="projects/logoo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #050505;
      --card-bg: #111111;
      --text-main: #ededed;
      --text-muted: #888888;
      --accent: #00ffc3;
      --border: #222222;
      --font-body: 'Inter', sans-serif;
      --font-head: 'Poppins', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    /* BG GRID */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
      pointer-events: none;
    }

    nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      display: flex;
      justify-content: center;
      gap: 3rem;
      padding: 1.5rem;
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(12px);
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    nav a {
      font-family: var(--font-head);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover, nav a.active { color: var(--accent); }

    header {
      padding: 8rem 2rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    header h1 {
      font-family: var(--font-head);
      font-size: 3rem;
      color: white;
      margin-bottom: 0.5rem;
    }
    
    header p { color: var(--text-muted); }

    /* GALLERY GRID */
    .gallery-section {
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    h2.section-title {
      font-family: var(--font-head);
      color: var(--accent);
      font-size: 1.5rem;
      margin: 3rem 0 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: inline-block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    /* MEDIA ITEM STYLING */
    .media-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card-bg);
      transition: transform 0.3s ease, border-color 0.3s ease;
      opacity: 0; /* JS Animation init */
      transform: translateY(20px);
    }
    
    .media-item.visible {
        opacity: 1; transform: translateY(0);
    }

    .media-item:hover {
      transform: translateY(-5px);
      border-color: var(--text-muted);
    }

    .media-item img, .media-item video {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s;
    }

    .media-item:hover img { opacity: 0.8; }
    
    /* Overlay for filename/title (Optional, derived from alt text logic if needed, but keeping it minimal) */
    
    .back-btn {
      display: block;
      width: fit-content;
      margin: 4rem auto;
      padding: 1rem 2rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: 0.3s;
    }
    
    .back-btn:hover { color: var(--accent); border-color: var(--accent); }

  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="projects.html" class="active">Projects</a>
    <a href="about.html">About</a>
  </nav>

  <header>
    <h1>Archive</h1>
    <p>A collection of renders, experiments, and prototypes.</p>
  </header>

  <div class="gallery-section">
    <h2 class="section-title">Visuals</h2>
    <div class="grid" id="image-grid">
      <div class="media-item"><img src="projects/INSOMNIA.png" alt="INSOMNIA" loading="lazy"/></div>
      <div class="media-item"><img src="projects/sunflower.png" alt="sunflower" loading="lazy"/></div>
      <div class="media-item"><img src="projects/STARWARS.png" alt="STARWARS" loading="lazy"/></div>
      <div class="media-item"><img src="projects/000.png" alt="Project" loading="lazy"/></div>
      <div class="media-item"><img src="projects/biohazard.png" alt="biohazard" loading="lazy"/></div>
      <div class="media-item"><img src="projects/CLIFF1.png" alt="CLIFF1" loading="lazy"/></div>
      <div class="media-item"><img src="projects/comeback.png" alt="comeback" loading="lazy"/></div>
      <div class="media-item"><img src="projects/DASHAIN.png" alt="DASHAIN" loading="lazy"/></div>
      <div class="media-item"><img src="projects/deer4.png" alt="deer4" loading="lazy"/></div>
      <div class="media-item"><img src="projects/DUNKRIK3.png" alt="DUNKRIK3" loading="lazy"/></div>
      <div class="media-item"><img src="projects/ETERNAL-PEACE.png" alt="ETERNAL-PEACE" loading="lazy"/></div>
      <div class="media-item"><img src="projects/GOAT.png" alt="GOAT" loading="lazy"/></div>
      <div class="media-item"><img src="projects/heart.png" alt="heart" loading="lazy"/></div>
      <div class="media-item"><img src="projects/idkbro_0000.png" alt="idkbro" loading="lazy"/></div>
      <div class="media-item"><img src="projects/kanye.png" alt="kanye" loading="lazy"/></div>
      <div class="media-item"><img src="projects/KNOWLEDGE1.png" alt="KNOWLEDGE1" loading="lazy"/></div>
      <div class="media-item"><img src="projects/mountain_wolf_by_aayushbhattarai_de9mq56.png" alt="mountain wolf" loading="lazy"/></div>
      <div class="media-item"><img src="projects/NEPAL.png" alt="NEPAL" loading="lazy"/></div>
      <div class="media-item"><img src="projects/PETSLOVER.png" alt="PETSLOVER" loading="lazy"/></div>
      <div class="media-item"><img src="projects/red_panda_by_aayushbhattarai_deavkkn.png" alt="red panda" loading="lazy"/></div>
      <div class="media-item"><img src="projects/RETRO.png" alt="RETRO" loading="lazy"/></div>

      <div class="media-item"><img src="projects/spiderman_poster_recreation_by_aayushbhattarai_de9mqdm.png" alt="spiderman" loading="lazy"/></div>
      <div class="media-item"><img src="projects/trmple.png" alt="trmple" loading="lazy"/></div>
      <div class="media-item"><img src="projects/VIKING.png" alt="VIKING" loading="lazy"/></div>
    </div>

    <h2 class="section-title">Motion</h2>
    <div class="grid">
      <div class="media-item"><video src="projects/My Video1.mp4" controls></video></div>
      <div class="media-item"><video src="projects/My Video2.mp4" controls></video></div>
      <div class="media-item"><video src="projects/My Video15.mp4" controls></video></div>
      <div class="media-item"><video src="projects/My Video29.mp4" controls></video></div>
      <div class="media-item"><video src="projects/out.mp4" controls></video></div>
    </div>
    
    <a href="index.html" class="back-btn">← Back Home</a>
  </div>

  <script>
    // Staggered Fade In for Grid Items
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target); // Run once
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.media-item').forEach((el, index) => {
        el.style.transitionDelay = `${index % 5 * 0.1}s`; // Stagger effect
        observer.observe(el);
    });
  </script>
</body>
</html>
