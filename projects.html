<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Aayush Bhattarai</title>
  <link rel="icon" href="projects/logoo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Premium Gallery Layout Overrides */
    header {
      padding: 8rem 2rem 4rem; 
      max-width: 1200px;
      margin: 0 auto;
      text-align: left; 
    }

    header h1 {
      font-family: var(--font-head);
      font-size: 4rem;
      letter-spacing: -2px;
      color: white;
      margin-bottom: 1rem;
    }
    
    header p { 
      color: var(--text-muted); 
      max-width: 600px;
      font-size: 1.1rem;
    }

    .gallery-section {
      padding: 0 2rem 8rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    h2.section-title {
      font-family: var(--font-head);
      color: var(--accent);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 4rem 0 2rem;
      display: block;
    }

    /* THE GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr); 
      gap: 2rem;
    }

    .media-item {
      position: relative;
      overflow: hidden;
      background: #0a0a0a;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(40px);
      grid-column: span 4; 
    }

    /* Randomizing sizes */
    .media-item:nth-child(3n+1) { grid-column: span 8; } 
    .media-item:nth-child(even) { grid-column: span 4; } 

    .media-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .media-item:hover {
      transform: scale(0.98); 
    }

    .media-item img, .media-item video {
      width: 100%;
      height: 100%;
      min-height: 400px;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) brightness(0.7);
      transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .media-item:hover img, .media-item:hover video {
      filter: grayscale(0%) brightness(1);
      transform: scale(1.1);
    }

    /* Mobile Responsive Fixes */
    @media (max-width: 1000px) {
      .media-item, .media-item:nth-child(3n+1) { grid-column: span 6; }
    }
    @media (max-width: 600px) {
      header h1 { font-size: 2.5rem; }
      .media-item, .media-item:nth-child(3n+1) { grid-column: span 12; }
      .grid { gap: 1rem; }
    }

    .back-btn {
      display: inline-block;
      margin-top: 4rem;
      padding: 1rem 2rem;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 2px;
      transition: 0.3s;
    }
    
    .back-btn:hover { background: white; color: black; border-color: white; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="projects.html" class="active">Projects</a>
    <a href="about.html">About</a>
  </nav>

  <header>
    <p style="color: var(--accent); letter-spacing: 2px; font-size: 0.8rem; margin-bottom: 0.5rem;">PORTFOLIO</p>
    <h1>Selected Archive</h1>
    <p>A curated collection of 3D experiments, digital renders, and technical prototypes developed between 2023 and 2025.</p>
  </header>

  <div class="gallery-section">
    <h2 class="section-title">Visual Works</h2>
    <div class="grid" id="image-grid">
      <div class="media-item"><img src="projects/INSOMNIA.png" alt="INSOMNIA" loading="lazy"/></div>
      <div class="media-item"><img src="projects/sunflower.png" alt="sunflower" loading="lazy"/></div>
      <div class="media-item"><img src="projects/STARWARS.png" alt="STARWARS" loading="lazy"/></div>
      <div class="media-item"><img src="projects/000.png" alt="Project" loading="lazy"/></div>
      <div class="media-item"><img src="projects/biohazard.png" alt="biohazard" loading="lazy"/></div>
      <div class="media-item"><img src="projects/CLIFF1.png" alt="CLIFF1" loading="lazy"/></div>
      <div class="media-item"><img src="projects/comeback.png" alt="comeback" loading="lazy"/></div>
      <div class="media-item"><img src="projects/DASHAIN.png" alt="DASHAIN" loading="lazy"/></div>
      <div class="media-item"><img src="projects/deer4.png" alt="deer4" loading="lazy"/></div>
      <div class="media-item"><img src="projects/DUNKRIK3.png" alt="DUNKRIK3" loading="lazy"/></div>
      <div class="media-item"><img src="projects/ETERNAL-PEACE.png" alt="ETERNAL-PEACE" loading="lazy"/></div>
      <div class="media-item"><img src="projects/GOAT.png" alt="GOAT" loading="lazy"/></div>
    </div>

    <h2 class="section-title">Motion</h2>
    <div class="grid">
      <div class="media-item"><video src="projects/My Video1.mp4" controls muted loop></video></div>
      <div class="media-item"><video src="projects/My Video2.mp4" controls muted loop></video></div>
      <div class="media-item"><video src="projects/out.mp4" controls muted loop></video></div>
    </div>
    
    <div style="text-align: center;">
        <a href="index.html" class="back-btn">Return to Overview</a>
    </div>
  </div>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.media-item').forEach((el) => observer.observe(el));
  </script>
</body>
</html>
